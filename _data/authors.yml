# The primary author of this blog.
# Must be the same as `author` in `_config.yml`.
# Change `author1` to your shortname.
author1:
  name:              Daniel Casanova
  email:             dubcasanova@gmail.com

  # Used at the bottom of each page and at the top of the `about` layout
  # Markdown enabled, can use multiple paragraphs (enabled by `|`)
  about:             |
    I’m Daniel Casanova, an Instructional Designer at the University of Houston College of Global Hospitality Leadership; an aspiring cinematographer. I have three years of teaching experience, including two years teaching math and one year teaching AP Computer Science. During the pandemic of 2020, I transitioned to online teaching, which revealed the limitations of virtual education for K-12 students. This inspired me to implement a flipped classroom model, providing students with access to my lectures at all times. These experiences equipped me with the skills needed to transition to instructional design at the University of Houston. In my first year, I helped professors transition their content from Blackboard to Canvas and created a template for our online Master’s program. In my second year, I helped plan our Doctorate in Global Hospitality and Leadership, and in my third year, I produced, edited, and delivered all of our online lectures with an emphasis on accessibility. These projects have earned me the trust of the faculty, who now feel comfortable sharing early iterations of their course ideas with me. Since then, I’ve been promoted annually to Instructional Designer III and received the \”Rising Star\” award for my accomplishments at Conrad N. Hilton College. My flexibility and eagerness to learn allow me to tackle new projects outside my skill set, expanding my expertise. I look forward to chatting with you! Feel free to contact me directly. 🤠


